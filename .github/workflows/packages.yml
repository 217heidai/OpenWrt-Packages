name: Update OpenWrt Packages
on: 
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
  - cron: 0 */12 * * *

env:
  TZ: Asia/Shanghai

jobs:
  Update_OpenWrt_Packages:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        info:
          - '{ "BRANCH": "openwrt-25.12"}'
          - '{ "BRANCH": "openwrt-24.10"}'
          - '{ "BRANCH": "openwrt-23.05"}'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ref: ${{fromJSON(matrix.info).BRANCH}}

      - name: Setup Python 3.9.x
        uses: actions/setup-python@main
        with:
          python-version: '3.9.x'

      - name: Install Dependencies
        run: |
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          pip install -U GitPython

      - name: Update OpenWrt Packages
        id: update
        run: |
          python packages.py
          rm -rf __pycache__
          echo "message=$(date)" >> $GITHUB_OUTPUT

      - name: Verify Feed (SDK Build)
        if: steps.update.outcome == 'success'
        run: |
          set -e
          BRANCH="${{fromJSON(matrix.info).BRANCH}}"
          VER="${BRANCH#openwrt-}"
          # ImmortalWrt 官方下载站（SDK 命名 immortalwrt-sdk-*）
          BASE="https://dl.wrt.moe/releases"
          # 定位该版本系列最新 release（如 25.12.2）
          SERIES="$(curl -fsSL "$BASE/" | grep -oE "href=\"${VER//./\\.}\\.[0-9]+/\"" | sed 's/href="//;s/"//;s|/$||' | sort -V | tail -1)"
          [ -n "$SERIES" ] || { echo "!! 未找到 $VER 系列 release"; exit 1; }
          echo "SDK series: $SERIES"
          SDK_FILE="$(curl -fsSL "$BASE/$SERIES/targets/x86/64/" | grep -oE 'href="immortalwrt-sdk-[^"]+\.tar\.(xz|zst)"' | sed 's/href="//;s/"//' | sort -V | tail -1)"
          [ -n "$SDK_FILE" ] || { echo "!! 未找到 $SERIES 的 x86/64 SDK"; exit 1; }
          echo "SDK file: $SDK_FILE"
          curl -fsSL -o "$SDK_FILE" "$BASE/$SERIES/targets/x86/64/$SDK_FILE"
          # 解压到工作区外（$RUNNER_TEMP）：src-link 指向 $GITHUB_WORKSPACE，
          # 若 SDK 在工作区内会形成文件系统环（File system loop），导致包扫描失败
          rm -rf "$RUNNER_TEMP/sdk"
          mkdir -p "$RUNNER_TEMP/sdk"
          # 新版 SDK 为 .tar.zst，旧版为 .tar.xz，按格式解压
          case "$SDK_FILE" in
            *.tar.zst) tar --zstd -xf "$SDK_FILE" -C "$RUNNER_TEMP/sdk" ;;
            *)         tar -xJf "$SDK_FILE" -C "$RUNNER_TEMP/sdk" ;;
          esac
          rm -f "$SDK_FILE"
          SDK_DIR="$(find "$RUNNER_TEMP/sdk" -maxdepth 1 -type d -name 'immortalwrt-sdk-*' | head -1)"
          [ -n "$SDK_DIR" ] || { echo "!! SDK 解压失败"; exit 1; }
          cd "$SDK_DIR"
          # SDK 默认不含官方 feeds，写入完整 feeds.conf：
          # 本仓库放最前：feeds install 对同名包先到先得（行序），
          # 保证 golang/smartdns/mosdns 等用本 feed 版本；
          # ImmortalWrt packages/luci + 官方 routing/telephony（对应版本分支）随后。
          # feed 名只能用 [A-Za-z0-9_]，zz_ 前缀在构建扫描阶段也排官方之后。
          cat > feeds.conf <<EOF
          src-link zz_openwrtpackages $GITHUB_WORKSPACE
          src-git packages https://github.com/immortalwrt/packages.git;openwrt-${VER}
          src-git luci https://github.com/immortalwrt/luci.git;openwrt-${VER}
          src-git routing https://github.com/openwrt/routing.git;openwrt-${VER}
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-${VER}
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          # 门禁编译：tcping（轻量 C 包）+ mosdns（Go 包，依赖官方 packages feed 的 golang）。
          # 不用 luci-app-smartdns：其依赖链（luci-base 全家桶 + 官方 smartdns）在 SDK 精简环境下误报率高
          make -j"$(nproc)" package/tcping/compile
          make -j"$(nproc)" package/mosdns/compile
          # 清理 SDK 临时目录
          rm -rf "$RUNNER_TEMP/sdk"

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.update.outputs.message }}

  Delete_Workflow:
    needs: [ Update_OpenWrt_Packages ]
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2